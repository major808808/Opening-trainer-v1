<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KID Repertoire Trainer</title><style>body{font-family:system-ui;margin:0;padding:14px;background:#f4f5f7}.app{max-width:900px;margin:auto}select,button{padding:9px;margin:3px;border:1px solid #bbb;border-radius:8px;background:white;font:inherit}.board{width:min(92vw,600px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:2px solid #222}.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(28px,7vw,58px);cursor:pointer}.l{background:#f0d9b5}.d{background:#b58863}.sel{outline:4px solid #e0bd3d;outline-offset:-4px}.layout{display:grid;grid-template-columns:minmax(280px,600px) 280px;gap:15px}@media(max-width:760px){.layout{grid-template-columns:1fr}.board{width:100%}}.panel{background:#fff;padding:12px;border-radius:12px;margin:10px 0}.moves{font:13px monospace;line-height:1.6;max-height:250px;overflow:auto}</style></head><body><div class="app"><h2>King's Indian Repertoire Trainer</h2><div class="panel"><select id="line"></select><button id="start">Start line</button><button id="take">Play full game</button><button id="reset">Reset</button><p id="status">Choose a line.</p></div><div class="layout"><div id="board" class="board"></div><div class="panel"><b>Moves</b><div id="moves" class="moves"></div><hr><small>Prototype 1: the opening trainer is the focus. The opponent is lightweight for now; the next version can use Stockfish.</small></div></div></div><script>
const L={"Classical / Mar del Plata":"1.d4 Nf6 2.c4 g6 3.Nc3 Bg7 4.e4 d6 5.Nf3 O-O 6.Be2 e5 7.O-O Nc6 8.d5 Ne7 9.Ne1 Nd7 10.Be3 f5 11.f3 f4 12.Bf2 g5","Sämisch":"1.d4 Nf6 2.c4 g6 3.Nc3 Bg7 4.e4 d6 5.f3 O-O 6.Be3 e5 7.d5 c6 8.Qd2 cxd5 9.cxd5 a6 10.g4 Nbd7","Fianchetto":"1.d4 Nf6 2.c4 g6 3.Nf3 Bg7 4.g3 d6 5.Bg2 O-O 6.O-O e5 7.Nc3 Nc6 8.d5 Ne7 9.e4 a5","Four Pawns":"1.d4 Nf6 2.c4 g6 3.Nc3 Bg7 4.e4 d6 5.f4 O-O 6.Nf3 e5 7.d5 c6 8.Be2 cxd5 9.cxd5 a5"};
const C={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};const F='abcdefgh',R='87654321';let b,t,sel,moves,line,idx,playing;
function reset(){b=[['r','n','b','q','k','b','n','r'],Array(8).fill('p'),...Array(4).fill(0).map(()=>Array(8).fill('')),Array(8).fill('P'),['R','N','B','Q','K','B','N','R']];t='w';sel=null;moves=[];idx=0;playing=false;draw()}
function coord(r,c){return F[c]+R[r]} function path(r,c,x,y){let a=r+Math.sign(x-r),d=c+Math.sign(y-c);while(a!=x||d!=y){if(b[a][d])return false;a+=Math.sign(x-r);d+=Math.sign(y-c)}return true}
function ok(r,c,x,y,p){let own=p===p.toUpperCase(),q=b[x][y];if(q&&(q===q.toUpperCase())===own)return false;let dr=x-r,dc=y-c,P=p.toUpperCase();if(P==='P'){let z=own?-1:1,s=own?6:1;return dc===0&&!q&&(dr===z||(r===s&&dr===2*z&&!b[r+z][c]))||Math.abs(dc)===1&&dr===z&&q}if(P==='N')return Math.abs(dr)*Math.abs(dc)===2;if(P==='K')return Math.max(Math.abs(dr),Math.abs(dc))===1;if(P==='B')return Math.abs(dr)===Math.abs(dc)&&path(r,c,x,y);if(P==='R')return (dr===0||dc===0)&&path(r,c,x,y);if(P==='Q')return (dr===0||dc===0||Math.abs(dr)===Math.abs(dc))&&path(r,c,x,y);return false}
function san(s){s=s.replace(/[+#?!]/g,'');if(s==='O-O'||s==='O-O-O'){let r=t==='w'?7:0,k=s==='O-O'?6:2,rc=s==='O-O'?5:3; b[r][k]=b[r][4];b[r][4]='';b[r][rc]=b[r][s==='O-O'?7:0];b[r][s==='O-O'?7:0]='';moves.push(s);t=t==='w'?'b':'w';return true}let m=s.match(/([a-h][1-8])$/);if(!m)return false;let x=R.indexOf(m[1][1]),y=F.indexOf(m[1][0]),P=/^[KQRBN]/.test(s)?s[0]:'P',found=null;for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=b[r][c];if(p&&p.toUpperCase()===P&&((p===p.toUpperCase())===(t==='w'))&&ok(r,c,x,y,p))found=[r,c]}if(!found)return false;let p=b[found[0]][found[1]];b[x][y]=p;b[found[0]][found[1]]='';moves.push(s);t=t==='w'?'b':'w';return true}
function draw(){let el=document.getElementById('board');el.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){let s=document.createElement('div');s.className='sq '+((r+c)%2?'d':'l');if(sel&&sel[0]===r&&sel[1]===c)s.classList.add('sel');s.textContent=C[b[r][c]]||'';s.onclick=()=>click(r,c);el.appendChild(s)}document.getElementById('moves').textContent=moves.join(' ')}
function click(r,c){if(!playing||t!=='b')return;let p=b[r][c];if(sel){let [a,d]=sel;if(p&&p===p.toLowerCase()){sel=[r,c];draw();return}if(ok(a,d,r,c,b[a][d])){b[r][c]=b[a][d];b[a][d]='';moves.push(coord(a,d)+'-'+coord(r,c));t='w';sel=null;draw();setTimeout(bot,250)}else{sel=null;draw()}}else if(p&&p===p.toLowerCase()){sel=[r,c];draw()}}
function bot(){let z=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]&&b[r][c]===b[r][c].toUpperCase())for(let x=0;x<8;x++)for(let y=0;y<8;y++)if(ok(r,c,x,y,b[r][c]))z.push([r,c,x,y]);if(!z.length)return;let [r,c,x,y]=z[Math.floor(Math.random()*z.length)];b[x][y]=b[r][c];b[r][c]='';moves.push(coord(r,c)+'-'+coord(x,y));t='b';document.getElementById('status').textContent='Your turn as Black.';draw()}
function start(){reset();line=L[document.getElementById('line').value].replace(/\d+\./g,'').split(/\s+/);while(idx<line.length){san(line[idx++]);if(t==='b'&&idx<line.length){san(line[idx++]);}}draw();document.getElementById('status').textContent='Line reached. You are Black.'}
document.getElementById('line').innerHTML=Object.keys(L).map(x=>`<option>${x}</option>`).join('');document.getElementById('start').onclick=start;document.getElementById('take').onclick=()=>{playing=true;document.getElementById('status').textContent='You are Black. Make your move.'};document.getElementById('reset').onclick=reset;reset();
</script></body></html>
